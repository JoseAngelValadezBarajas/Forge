[package]
name = "forge-desktop"
version = "0.1.0"
description = "Forge Windows desktop host"
authors = ["Jose Angel Valadez Barajas"]
edition = "2024"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
base64 = "=0.22.1"
rand = "=0.9.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.12.4", features = [] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }
url = "=2.5.7"
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
