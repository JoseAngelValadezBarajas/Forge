name: Forge main desktop artifact

on:
  workflow_run:
    workflows: ["Forge quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA of the current main commit to certify.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: forge-main-desktop-${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify main quality and CodeQL for exact SHA
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      codeql_run_id: ${{ steps.codeql.outputs.codeql_run_id }}
    steps:
      - name: Validate trusted completion event and commit
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$EVENT_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || { echo "Refusing workflow_run from repository $EVENT_REPOSITORY." >&2; exit 1; }
            [[ "$EVENT_BRANCH" == "main" ]] || { echo "Refusing workflow_run from branch $EVENT_BRANCH." >&2; exit 1; }
            [[ "$EVENT_CONCLUSION" == "success" ]] || { echo "Forge quality did not pass: $EVENT_CONCLUSION." >&2; exit 1; }
            sha="$EVENT_SHA"
          else
            [[ "$MANUAL_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Manual dispatch requires a 40-character commit SHA." >&2; exit 1; }
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            [[ "${MANUAL_SHA,,}" == "${current_main,,}" ]] || { echo "Manual SHA is not the current main SHA: $current_main." >&2; exit 1; }
            sha="$current_main"
          fi
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid certified SHA: $sha." >&2; exit 1; }
          echo "commit_sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Wait for CodeQL success on the same SHA
        id: codeql
        shell: bash
        env:
          CERTIFIED_SHA: ${{ steps.validate.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t codeql_ids < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[] | select(.name == "CodeQL") | .id')
          if [[ "${#codeql_ids[@]}" -ne 1 ]]; then
            echo "Expected exactly one CodeQL workflow, found ${#codeql_ids[@]}." >&2
            exit 1
          fi
          workflow_id="${codeql_ids[0]}"
          for attempt in $(seq 1 40); do
            success_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$CERTIFIED_SHA&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$CERTIFIED_SHA\") | select(.head_branch == \"main\") | select(.conclusion == \"success\") | .id" | head -n 1)"
            if [[ -n "$success_run" ]]; then
              echo "CodeQL run $success_run passed for $CERTIFIED_SHA."
              echo "codeql_run_id=$success_run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$CERTIFIED_SHA&per_page=100" --jq ".workflow_runs[] | select(.head_sha == \"$CERTIFIED_SHA\") | select(.head_branch == \"main\") | select(.status == \"completed\") | select(.conclusion != \"success\") | .id" | head -n 1)"
            if [[ -n "$failed_run" ]]; then
              echo "CodeQL run $failed_run completed unsuccessfully for $CERTIFIED_SHA." >&2
              exit 1
            fi
            echo "Waiting for CodeQL workflow $workflow_id on $CERTIFIED_SHA (attempt $attempt/40)."
            sleep 15
          done
          echo "Timed out waiting for CodeQL success on exact SHA $CERTIFIED_SHA." >&2
          exit 1

  desktop:
    name: Main Windows certified installer
    needs: guard
    uses: ./.github/workflows/desktop-certified.yml
    with:
      commit_sha: ${{ needs.guard.outputs.commit_sha }}
      artifact_name: forge-windows-x64-main-${{ needs.guard.outputs.commit_sha }}
      artifact_retention_days: 14
      publish_certified_artifact: true
