name: Forge Windows desktop

on:
  push:
    branches: [desktop/desk-01-windows-alpha]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change-classification:
    name: Classify desktop changes
    runs-on: ubuntu-latest
    outputs:
      desktop_required: ${{ steps.classify.outputs.desktop_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/forge-change-paths.txt"
          : > "$paths_file"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$paths_file"
          fi
          python scripts/ci_change_policy.py \
            --event "$EVENT_NAME" \
            --paths-file "$paths_file" >> "$GITHUB_OUTPUT"

  windows-installed-product:
    name: Windows x64 build and installed-product smoke
    needs: change-classification
    if: needs.change-classification.outputs.desktop_required == 'true'
    uses: ./.github/workflows/desktop-certified.yml
    with:
      commit_sha: ${{ github.sha }}
      artifact_name: forge-windows-x64-pr-${{ github.sha }}-${{ github.run_id }}
      artifact_retention_days: 7
      publish_certified_artifact: false
